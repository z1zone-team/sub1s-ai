name: Preference model CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2.6,<3' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'pytest>=8,<9'
      - run: python -m pytest --noconftest tests/test_preference_v2.py
