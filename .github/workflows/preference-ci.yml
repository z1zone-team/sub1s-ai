name: Preference model CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2.6,<3' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'pytest>=8,<9'
      - name: Preference contract tests
        shell: python
        run: |
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, '-m', 'pytest', '--noconftest', 'tests/test_preference_v2.py'],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          print(result.stdout)
          if result.returncode:
              message = result.stdout[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{message}')
          raise SystemExit(result.returncode)
